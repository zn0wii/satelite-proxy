[package]
name = "satelite-proxy"
version = "1.0.4"
description = "Satelite — lightweight sing-box desktop client"
authors = ["you"]
edition = "2021"

[lib]
name = "satelite_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
url = "2"
urlencoding = "2"
idna = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = true, features = ["json", "stream"] }
# Clash API must not use reqwest::blocking — nested Tokio runtime panics inside
# tauri async workers ("Cannot drop a runtime in a context where blocking is not allowed").
ureq = { version = "2.12", default-features = true, features = ["json"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
flate2 = "1"
if-addrs = "0.15.0"
tar = "0.4"
zip = "2"
tauri-plugin-deep-link = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# Same windows crate tauri already depends on (version-unified, no extra copy);
# adds the NT process-table query used by core::memory's RSS probe.
windows = { version = "0.61", features = [
    "Wdk_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    "Win32_Foundation",
] }
