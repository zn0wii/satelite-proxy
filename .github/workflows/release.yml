name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 — base tauri.conf.json already bundles all three cores
          - platform: macos-latest
            target: aarch64-apple-darwin
            core-dir: darwin-arm64
            fetch-core: scripts/fetch-bundled-core-darwin-arm64.sh
            fetch-xray: scripts/fetch-bundled-xray-darwin-arm64.sh
            fetch-mihomo: scripts/fetch-bundled-mihomo-darwin-arm64.sh
            fetch-aether: scripts/fetch-bundled-aether-darwin-arm64.sh
            tauri-config: src-tauri/tauri.conf.json
          # macOS intel
          - platform: macos-latest
            target: x86_64-apple-darwin
            core-dir: darwin-amd64
            fetch-core: scripts/fetch-bundled-core-darwin-amd64.sh
            fetch-xray: scripts/fetch-bundled-xray-darwin-amd64.sh
            fetch-mihomo: scripts/fetch-bundled-mihomo-darwin-amd64.sh
            fetch-aether: scripts/fetch-bundled-aether-darwin-amd64.sh
            tauri-config: src-tauri/tauri.macos-intel.conf.json
          # Windows amd64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            core-dir: windows-amd64
            fetch-core: scripts/fetch-bundled-core-windows-amd64.ps1
            fetch-xray: scripts/fetch-bundled-xray-windows-amd64.ps1
            fetch-mihomo: scripts/fetch-bundled-mihomo-windows-amd64.ps1
            fetch-aether: scripts/fetch-bundled-aether-windows-amd64.ps1
            tauri-config: src-tauri/tauri.windows.conf.json
          # Linux amd64
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            core-dir: linux-amd64
            fetch-core: scripts/fetch-bundled-core-linux-amd64.sh
            fetch-xray: scripts/fetch-bundled-xray-linux-amd64.sh
            fetch-mihomo: scripts/fetch-bundled-mihomo-linux-amd64.sh
            fetch-aether: scripts/fetch-bundled-aether-linux-amd64.sh
            tauri-config: src-tauri/tauri.linux.conf.json

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Cores + rule sets are pure downloads keyed by the fetch scripts'
      # content hash: bumping a pinned version changes the key and forces a
      # fresh download; everything else restores from cache (zero network).
      - name: Bundled cores cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/bin/${{ matrix.core-dir }}
            src-tauri/resources/rule-sets
          key: bundled-cores-${{ matrix.core-dir }}-${{ hashFiles(matrix.fetch-core, matrix.fetch-xray, matrix.fetch-mihomo, matrix.fetch-aether, 'scripts/fetch-bundled-rule-sets.sh') }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # The fetch scripts skip on their own when the pinned version is
      # already staged, so cache hits stay offline; misses go through
      # ci-fetch-with-retry.sh (30s backoff) to ride out runner network blips.
      - name: Fetch bundled cores & rule sets
        shell: bash
        run: >
          bash scripts/ci-fetch-with-retry.sh
          ${{ matrix.fetch-core }} ${{ matrix.fetch-xray }} ${{ matrix.fetch-mihomo }} ${{ matrix.fetch-aether }}
          scripts/fetch-bundled-rule-sets.sh

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS runners stamp files with the com.apple.provenance xattr;
          # the action's `tar` then trips over Apple metadata handling
          # ("Operation not permitted") while packaging the .app into the
          # .app.tar.gz release asset (seen first on the v1.0.33 arm64 run).
          # COPYFILE_DISABLE makes bsdtar skip AppleDouble/xattr encoding
          # entirely — no-op on Linux/Windows.
          COPYFILE_DISABLE: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Satelite ${{ github.ref_name }}"
          releaseBody: "Automatic release"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --config ${{ matrix.tauri-config }}

  windows-portable:
    needs: release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Same key as the release job's windows-amd64 matrix entry, so the
      # portable zip reuses the cache the release build just saved.
      - name: Bundled cores cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/bin/windows-amd64
            src-tauri/resources/rule-sets
          key: bundled-cores-windows-amd64-${{ hashFiles('scripts/fetch-bundled-core-windows-amd64.ps1', 'scripts/fetch-bundled-xray-windows-amd64.ps1', 'scripts/fetch-bundled-mihomo-windows-amd64.ps1', 'scripts/fetch-bundled-aether-windows-amd64.ps1', 'scripts/fetch-bundled-rule-sets.sh') }}

      # build-windows.ps1 fetches missing cores without any retry; prefetch
      # here so the downloads get the same retry treatment as the release job.
      - name: Prefetch bundled cores & rule sets
        shell: bash
        run: >
          bash scripts/ci-fetch-with-retry.sh
          scripts/fetch-bundled-core-windows-amd64.ps1
          scripts/fetch-bundled-xray-windows-amd64.ps1
          scripts/fetch-bundled-mihomo-windows-amd64.ps1
          scripts/fetch-bundled-aether-windows-amd64.ps1
          scripts/fetch-bundled-rule-sets.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build portable zip
        shell: pwsh
        run: scripts/build-windows.ps1 -Bundle portable

      - name: Upload portable zip to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" src-tauri/target/release/bundle/portable/*.zip --clobber
