name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64
          - platform: macos-latest
            target: aarch64-apple-darwin
            core-dir: darwin-arm64
            variant: fullcores
            fetch-core: scripts/fetch-bundled-core-darwin-arm64.sh
            fetch-xray: scripts/fetch-bundled-xray-darwin-arm64.sh
            fetch-mihomo: scripts/fetch-bundled-mihomo-darwin-arm64.sh
            tauri-config: src-tauri/tauri.fullcores-darwin-arm64.conf.json
          - platform: macos-latest
            target: aarch64-apple-darwin
            core-dir: darwin-arm64
            variant: singbox
            fetch-core: scripts/fetch-bundled-core-darwin-arm64.sh
            fetch-xray: ""
            fetch-mihomo: ""
            tauri-config: src-tauri/tauri.singbox-darwin-arm64.conf.json
          # macOS intel
          - platform: macos-latest
            target: x86_64-apple-darwin
            core-dir: darwin-amd64
            variant: fullcores
            fetch-core: scripts/fetch-bundled-core-darwin-amd64.sh
            fetch-xray: scripts/fetch-bundled-xray-darwin-amd64.sh
            fetch-mihomo: scripts/fetch-bundled-mihomo-darwin-amd64.sh
            tauri-config: src-tauri/tauri.macos-intel.conf.json
          - platform: macos-latest
            target: x86_64-apple-darwin
            core-dir: darwin-amd64
            variant: singbox
            fetch-core: scripts/fetch-bundled-core-darwin-amd64.sh
            fetch-xray: ""
            fetch-mihomo: ""
            tauri-config: src-tauri/tauri.singbox-darwin-amd64.conf.json
          # Windows amd64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            core-dir: windows-amd64
            variant: fullcores
            fetch-core: scripts/fetch-bundled-core-windows-amd64.ps1
            fetch-xray: scripts/fetch-bundled-xray-windows-amd64.ps1
            fetch-mihomo: scripts/fetch-bundled-mihomo-windows-amd64.ps1
            tauri-config: src-tauri/tauri.windows.conf.json
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            core-dir: windows-amd64
            variant: singbox
            fetch-core: scripts/fetch-bundled-core-windows-amd64.ps1
            fetch-xray: ""
            fetch-mihomo: ""
            tauri-config: src-tauri/tauri.singbox-windows.conf.json
          # Linux amd64
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            core-dir: linux-amd64
            variant: fullcores
            fetch-core: scripts/fetch-bundled-core-linux-amd64.sh
            fetch-xray: scripts/fetch-bundled-xray-linux-amd64.sh
            fetch-mihomo: scripts/fetch-bundled-mihomo-linux-amd64.sh
            tauri-config: src-tauri/tauri.linux.conf.json
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            core-dir: linux-amd64
            variant: singbox
            fetch-core: scripts/fetch-bundled-core-linux-amd64.sh
            fetch-xray: ""
            fetch-mihomo: ""
            tauri-config: src-tauri/tauri.singbox-linux-amd64.conf.json

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Fetch bundled sing-box core (Unix)
        if: runner.os != 'Windows'
        run: ${{ matrix.fetch-core }}

      - name: Fetch bundled sing-box core (Windows)
        if: runner.os == 'Windows'
        run: pwsh ${{ matrix.fetch-core }}

      - name: Fetch bundled Xray core (Unix)
        if: runner.os != 'Windows' && matrix.fetch-xray != ''
        run: ${{ matrix.fetch-xray }}

      - name: Fetch bundled Xray core (Windows)
        if: runner.os == 'Windows' && matrix.fetch-xray != ''
        run: pwsh ${{ matrix.fetch-xray }}

      - name: Fetch bundled mihomo core (Unix)
        if: runner.os != 'Windows' && matrix.fetch-mihomo != ''
        run: ${{ matrix.fetch-mihomo }}

      - name: Fetch bundled mihomo core (Windows)
        if: runner.os == 'Windows' && matrix.fetch-mihomo != ''
        run: pwsh ${{ matrix.fetch-mihomo }}

      - name: Fetch bundled rule sets
        run: scripts/fetch-bundled-rule-sets.sh
        shell: bash

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Satelite ${{ github.ref_name }}"
          releaseBody: "Automatic release"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --config ${{ matrix.tauri-config }}

  windows-portable:
    needs: release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build fullcores portable zip
        shell: pwsh
        run: scripts/build-windows.ps1 -Bundle portable

      - name: Build singbox-only portable zip
        shell: pwsh
        run: scripts/build-windows.ps1 -Bundle portable -SingboxOnly

      - name: Upload portable zips to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" src-tauri/target/release/bundle/portable/*.zip --clobber
